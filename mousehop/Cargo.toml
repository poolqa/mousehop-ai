[package]
name = "mousehop"
description = "Mousehop background application and platform runtime"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
default-run = "mousehop"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
mousehop-logging = { workspace = true }
mousehop-core = { workspace = true, default-features = false }
mousehop-ipc = { workspace = true }
mousehop-cli = { workspace = true }
input-capture = { workspace = true, default-features = false }
env_logger = "0.11.3"
log = "0.4.20"
thiserror = "2.0.0"
clap = { version = "4.4.11", features = ["derive"] }
tokio = { version = "1.32.0", features = ["rt", "time", "sync", "process", "signal", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["layer_shell_capture", "x11_capture", "libei_capture", "wlroots_emulation", "libei_emulation", "rdp_emulation", "x11_emulation"]
gtk = []
layer_shell_capture = ["mousehop-core/layer_shell_capture"]
x11_capture = ["mousehop-core/x11_capture"]
libei_capture = ["mousehop-core/libei_capture"]
wlroots_emulation = ["mousehop-core/wlroots_emulation"]
libei_emulation = ["mousehop-core/libei_emulation"]
rdp_emulation = ["mousehop-core/rdp_emulation"]
x11_emulation = ["mousehop-core/x11_emulation"]

[package.metadata.bundle]
name = "Mousehop"
# `target/` and `build-aux/` live at the workspace root. cargo-bundle
# resolves these globs from the *current working directory* (not the
# manifest), so the release workflow must `cd mousehop && cargo bundle`
# — otherwise the icon, menu-bar template, and LSUIElement / TCC
# usage-description plist are silently dropped from the .app.
#
# The `resources` glob's `..` segment is then rewritten to `_up_` by
# cargo-bundle's resource_relpath, so `menubar-template.png` lands at
# `Resources/_up_/target/...`. `scripts/copy-macos-dylib.sh` flattens
# it back to the Resources root so NSBundle pathForResource: finds it.
icon = ["../target/icon.icns"]
identifier = "com.mousehop.Mousehop"
osx_info_plist_exts = ["../build-aux/macos-lsui-element.plist"]
resources = ["../target/menubar-template.png"]
