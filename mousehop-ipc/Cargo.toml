[package]
name = "mousehop-ipc"
description = "library for communication between mousehop service and frontends"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jondkinney/mousehop"

[dependencies]
futures = "0.3.30"
input-event = { workspace = true, default-features = false }
log = "0.4.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = ["macros", "net", "io-util", "time"] }
tokio-stream = { version = "0.1.15", features = ["io-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem"] }
