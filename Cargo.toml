[workspace]
resolver = "2"
# Keep plain `cargo run` focused on the app, not the installer bootstrap helper.
default-members = ["mousehop"]
members = [
    "input-capture",
    "input-emulation",
    "input-event",
    "mousehop",
    "mousehop-core",
    "mousehop-logging",
    "mousehop-ipc",
    "mousehop-installer",
    "mousehop-cli",
    "mousehop-gtk",
    "mousehop-proto",
]

[workspace.package]
version = "0.18.0"

[workspace.dependencies]
mousehop-logging = { path = "mousehop-logging", version = "0.18.0" }
mousehop-core = { path = "mousehop-core", version = "0.18.0", default-features = false }
input-event = { package = "mousehop-input-event", path = "input-event", version = "0.18.0", default-features = false }
input-capture = { package = "mousehop-input-capture", path = "input-capture", version = "0.18.0", default-features = false }
input-emulation = { package = "mousehop-input-emulation", path = "input-emulation", version = "0.18.0", default-features = false }
mousehop-proto = { path = "mousehop-proto", version = "0.18.0" }
mousehop-ipc = { path = "mousehop-ipc", version = "0.18.0" }
mousehop-cli = { path = "mousehop-cli", version = "0.18.0" }
mousehop-gtk = { path = "mousehop-gtk", version = "0.18.0" }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"
